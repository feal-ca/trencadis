<!doctype html>
<meta charset="utf-8">
<title>thumbs</title>
<canvas id="c"></canvas>
<script type="module">
// Renders the method and style thumbnails, close-ups of the face where the
// shape of the pieces shows; scripts/thumbs.mjs collects them.
import { createPipeline } from '/src/core/pipeline.js';
import { DEFAULTS } from '/src/core/params.js';
import { applyMacroDefaults, applyStyle, STYLES } from '/src/core/macros.js';
import { fromImageData } from '/src/core/image.js';
import { createRenderer } from '/src/gl/renderer.js';
import { ALGORITHMS } from '/src/core/params.js';

const bmp = await createImageBitmap(await (await fetch('/samples/vermeer.webp')).blob());
const s = 700 / Math.max(bmp.width, bmp.height);
const cv = new OffscreenCanvas(Math.round(bmp.width * s), Math.round(bmp.height * s));
cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
const img = fromImageData(cv.getContext('2d').getImageData(0, 0, cv.width, cv.height));
const pipe = createPipeline();
pipe.setImage(img);
const r = createRenderer(document.getElementById('c'));
const base = applyMacroDefaults(DEFAULTS);
const out = {};
const render = async (p) => {
  const st = {};
  await pipe.run(p, (n, v) => { st[n] = v; }, undefined, undefined, undefined, { cpuRender: false });
  r.setShards(st.tessellation.shards, img.w, img.h, p.seed);
  r.setColors(st.color.colors, p.seed);
  const [W, H] = r.sizeFor(1000);
  r.render(p, W, H);
  // A square around the face (the crop is a share of the width).
  const side = crop * W, sx = 0.47 * W - side / 2, sy = 0.4 * H - side / 2;
  const out = new OffscreenCanvas(160, 160);
  out.getContext('2d').drawImage(document.getElementById('c'), sx, sy, side, side, 0, 0, 160, 160);
  const blob = await out.convertToBlob({ type: 'image/jpeg', quality: 0.85 });
  return { url: await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); }), st };
};
let crop = 0.42;
for (const a of ALGORITHMS) out[`algo-${a.value}`] = (await render({ ...base, groutColor: '#2f2b27', algorithm: a.value })).url;
crop = 0.6;
for (const st of STYLES) {
  const p = applyStyle(DEFAULTS, st.id).params;
  out[`style-${st.id}`] = (await render(p.groutColor === 'auto' ? { ...p, groutColor: '#2f2b27' } : p)).url;
}
window.result = out;
document.title = 'done';
</script>
