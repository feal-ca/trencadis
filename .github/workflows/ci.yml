name: CI

on:
  pull_request:
  push:
    branches-ignore: ['main']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build with Vite
        run: npm run build

      - name: Check dist size
        run: node scripts/check-dist.mjs

      - name: Smoke test in Chromium
        run: |
          npx playwright-core install --with-deps chromium
          npm run smoke

  # Runs the segmentation model (downloaded from Hugging Face) on WASM. It
  # depends on the network and takes a while, so a failure here does not fail
  # the workflow that deploy.yml waits for.
  seg-shot:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Segmentation in Chromium
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/seg-shot.mjs
