name: CI

on:
  pull_request:
  push:
    branches-ignore: ['main']
  workflow_call:
    inputs:
      seg_shot:
        description: Run the segmentation job (deploy.yml turns it off so it does not wait for it)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build with Vite
        run: npm run build

      - name: Check dist size
        run: node scripts/check-dist.mjs

      - name: Smoke test in Chromium
        run: |
          npx playwright-core install --with-deps chromium
          npm run smoke

  # Runs the segmentation model (downloaded from Hugging Face) on WASM. It
  # depends on the network and takes a while, so deploy.yml skips it with
  # seg_shot: false, and a failure here does not fail the workflow.
  seg-shot:
    if: ${{ inputs.seg_shot != false }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Segmentation in Chromium
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/seg-shot.mjs
